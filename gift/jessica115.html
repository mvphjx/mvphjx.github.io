<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>生日抽奖游戏</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #FFFFFF;
            color: #003399;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        /* 冰球主题装饰元素 */
        .hockey-stripe {
            position: absolute;
            width: 100%;
            height: 8px;
            z-index: 1;
        }

        .stripe-top {
            top: 0;
            background: linear-gradient(to right, #0099FF, #FF6600, #CC0000);
        }

        .stripe-bottom {
            bottom: 0;
            background: linear-gradient(to right, #0099FF, #FF6600, #CC0000);
        }

        .hockey-circle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, #0099FF, #003399);
            opacity: 0.1;
            z-index: 0;
        }

        .circle-1 {
            width: 150px;
            height: 150px;
            top: 10%;
            left: -50px;
        }

        .circle-2 {
            width: 200px;
            height: 200px;
            bottom: 10%;
            right: -80px;
        }

        /* 主容器 */
        .container {
            max-width: 100%;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 2;
        }

        /* 首屏祝福页面 */
        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            height: 100vh;
            padding: 20px;
            transition: transform 0.5s ease;
        }

        .birthday-title {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: #003399;
            text-shadow: 2px 2px 4px rgba(0, 51, 153, 0.1);
        }

        .birthday-subtitle {
            font-size: 1.5rem;
            margin-bottom: 40px;
            color: #0099FF;
        }

        .blessing-text {
            font-size: 1.8rem;
            line-height: 1.5;
            margin-bottom: 60px;
            color: #003399;
        }

        .blessing-text span {
            display: block;
            margin: 10px 0;
        }

        /* 抽奖按钮 */
        .draw-btn {
            background: linear-gradient(to right, #0099FF, #003399);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 18px 50px;
            font-size: 1.8rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0, 153, 255, 0.3);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .draw-btn:hover, .draw-btn:active {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 153, 255, 0.4);
        }

        .draw-btn:before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
            z-index: -1;
        }

        .draw-btn:hover:before, .draw-btn:active:before {
            left: 100%;
        }

        /* 抽奖页面 */
        .lottery-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100vh;
            padding: 20px;
            position: absolute;
            top: 0;
            left: 0;
        }

        .lottery-title {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: #003399;
            text-align: center;
        }

        /* 大转盘 */
        .turntable-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 20px auto;
        }

        .turntable {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            transition: transform 5s cubic-bezier(0.17, 0.67, 0.21, 0.99);
            background-color: #FFFFFF;
        }

        .turntable-item {
            position: absolute;
            width: 50%;
            height: 50%;
            transform-origin: 100% 100%;
            left: 0;
            top: 0;
            text-align: center;
            padding-top: 30px;
            color: white;
            font-weight: bold;
            overflow: hidden;
        }

        .turntable-item:nth-child(1) {
            background-color: #0099FF;
            transform: rotate(0deg) skewY(-30deg);
        }

        .turntable-item:nth-child(2) {
            background-color: #FF6600;
            transform: rotate(60deg) skewY(-30deg);
        }

        .turntable-item:nth-child(3) {
            background-color: #CC0000;
            transform: rotate(120deg) skewY(-30deg);
        }

        .turntable-item:nth-child(4) {
            background-color: #003399;
            transform: rotate(180deg) skewY(-30deg);
        }

        .turntable-item:nth-child(5) {
            background-color: #0099FF;
            transform: rotate(240deg) skewY(-30deg);
        }

        .turntable-item:nth-child(6) {
            background-color: #FF6600;
            transform: rotate(300deg) skewY(-30deg);
        }

        .item-content {
            transform: skewY(30deg) rotate(15deg);
            font-size: 14px;
            padding: 0 5px;
        }

        .center-circle {
            position: absolute;
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            border: 4px solid #003399;
        }

        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #CC0000;
            z-index: 20;
        }

        /* 抽奖结果页面 */
        .result-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100vh;
            padding: 20px;
            position: absolute;
            top: 0;
            left: 0;
            background-color: rgba(255, 255, 255, 0.95);
        }

        .result-title {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 30px;
            color: #003399;
            text-align: center;
        }

        .gift-image {
            width: 200px;
            height: 200px;
            border-radius: 15px;
            margin: 20px 0;
            object-fit: cover;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            border: 5px solid #0099FF;
        }

        .gift-name {
            font-size: 1.8rem;
            font-weight: bold;
            color: #CC0000;
            margin: 10px 0;
            text-align: center;
        }

        .gift-description {
            font-size: 1.2rem;
            color: #003399;
            text-align: center;
            line-height: 1.5;
            margin-bottom: 30px;
            padding: 0 10px;
        }

        .action-buttons {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .action-btn {
            padding: 12px 25px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
        }

        .draw-again {
            background-color: #0099FF;
            color: white;
        }

        .back-home {
            background-color: #FFFFFF;
            color: #003399;
            border: 2px solid #003399;
        }

        .action-btn:hover, .action-btn:active {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        /* 底部装饰 */
        .hockey-icon {
            font-size: 1.5rem;
            color: #0099FF;
            margin: 0 5px;
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            color: #003399;
            font-size: 1rem;
        }

        /* 响应式调整 */
        @media (max-width: 480px) {
            .birthday-title {
                font-size: 2rem;
            }

            .blessing-text {
                font-size: 1.5rem;
            }

            .draw-btn {
                padding: 15px 40px;
                font-size: 1.5rem;
            }

            .turntable-container {
                width: 280px;
                height: 280px;
            }

            .item-content {
                font-size: 12px;
            }
        }

        /* 动画效果 */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            60% {
                transform: translateY(-5px);
            }
        }

        .fade-in {
            animation: fadeIn 1s ease;
        }

        .bounce {
            animation: bounce 2s infinite;
        }

        .pulse {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
            100% {
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
<!-- 冰球主题装饰 -->
<div class="hockey-stripe stripe-top"></div>
<div class="hockey-stripe stripe-bottom"></div>
<div class="hockey-circle circle-1"></div>
<div class="hockey-circle circle-2"></div>

<div class="container">
    <!-- 首屏祝福页面 -->
    <div class="welcome-screen fade-in" id="welcomeScreen">
        <h1 class="birthday-title">Jessica 生日快乐</h1>
        <h2 class="birthday-subtitle">这是一个生日抽奖游戏</h2>

        <div class="blessing-text">
            <span>天天开心</span>
            <span>保持热爱</span>
            <span>愿快乐与冰球一样</span>
            <span>永远在你生活中旋转</span>
        </div>

        <button class="draw-btn bounce" id="startDraw">
            点击抽奖 <i class="fas fa-gift hockey-icon"></i>
        </button>

        <div class="footer">
            <p><i class="fas fa-hockey-puck hockey-icon"></i> <i class="fas fa-ice-skate hockey-icon"></i> <i
                    class="fas fa-trophy hockey-icon"></i></p>
        </div>
    </div>

    <!-- 抽奖转盘页面 -->
    <div class="lottery-screen" id="lotteryScreen">
        <h2 class="lottery-title">生日大转盘</h2>
        <p style="color: #0099FF; margin-bottom: 30px; font-size: 1.2rem; text-align: center;">转动转盘，抽取你的生日礼物！</p>

        <div class="turntable-container">
            <div class="pointer"></div>
            <div class="turntable" id="turntable">
                <div class="turntable-item">
                    <div class="item-content">vlog神器</div>
                </div>
                <div class="turntable-item">
                    <div class="item-content">泡泡玛特<br>盲盒</div>
                </div>
                <div class="turntable-item">
                    <div class="item-content">幸运红包</div>
                </div>
                <div class="turntable-item">
                    <div class="item-content">豪华晚餐</div>
                </div>
                <div class="turntable-item">
                    <div class="item-content">护肤品</div>
                </div>
                <div class="turntable-item">
                    <div class="item-content">加油卡</div>
                </div>

                <div class="center-circle">
                    <span style="color: #003399; font-weight: bold; font-size: 1.2rem;">抽奖</span>
                </div>
            </div>
        </div>

        <button class="draw-btn pulse" id="drawButton" style="margin-top: 40px;">
            开始抽奖 <i class="fas fa-play hockey-icon"></i>
        </button>

        <button class="action-btn back-home" id="backHome" style="margin-top: 20px;">
            返回首页
        </button>
    </div>

    <!-- 抽奖结果页面 -->
    <div class="result-screen" id="resultScreen">
        <h2 class="result-title">恭喜你抽中了！</h2>

        <img class="gift-image" id="giftImage" src="" alt="礼物图片">

        <h3 class="gift-name" id="giftName">礼物名称</h3>

        <p class="gift-description" id="giftDescription">礼物描述</p>

        <div class="action-buttons">
            <button class="action-btn draw-again" id="drawAgain">
                再抽一次
            </button>
            <button class="action-btn back-home" id="backHome2">
                返回首页
            </button>
        </div>
    </div>
</div>

<script>
    // 礼物数据
    const gifts = [
        {
            name: "vlog神器",
            description: "DJI Pocket 3，记录生活每一刻，让你的vlog更加精彩！",
            color: "#0099FF",
            image: "img/1.jpg"
        },
        {
            name: "泡泡玛特",
            description: "两端泡泡玛特盲盒，开启惊喜，迎接可爱与美好！",
            color: "#FF6600",
            image: "img/1.jpg"
        },
        {
            name: "幸运红包",
            description: "现金红包1888元，愿好运常伴，财源滚滚！",
            color: "#CC0000",
            image: "img/1.jpg"
        },
        {
            name: "豪华晚餐",
            description: "邀请朋友一起享受美食与美好时光！",
            color: "#003399",
            image: "img/1.jpg"
        },
        {
            name: "护肤品",
            description: "顶级品牌护肤品套装，让你每天容光焕发，美丽自信！",
            color: "#0099FF",
            image: "img/1.jpg"
        },
        {
            name: "加油卡",
            description: "价值2000元的石化油卡，让你的旅途无忧，一路顺风！",
            color: "#FF6600",
            image: "img/1.jpg"
        }
    ];

    // DOM元素
    const welcomeScreen = document.getElementById('welcomeScreen');
    const lotteryScreen = document.getElementById('lotteryScreen');
    const resultScreen = document.getElementById('resultScreen');
    const startDrawBtn = document.getElementById('startDraw');
    const drawButton = document.getElementById('drawButton');
    const turntable = document.getElementById('turntable');
    const backHomeBtn = document.getElementById('backHome');
    const backHomeBtn2 = document.getElementById('backHome2');
    const drawAgainBtn = document.getElementById('drawAgain');
    const giftImage = document.getElementById('giftImage');
    const giftName = document.getElementById('giftName');
    const giftDescription = document.getElementById('giftDescription');

    // 当前旋转角度
    let currentRotation = 0;
    // 是否正在旋转
    let isSpinning = false;

    // 开始抽奖按钮点击事件
    startDrawBtn.addEventListener('click', () => {
        welcomeScreen.style.display = 'none';
        lotteryScreen.style.display = 'flex';
        lotteryScreen.classList.add('fade-in');
    });

    // 返回首页按钮点击事件
    const goBackHome = () => {
        lotteryScreen.style.display = 'none';
        resultScreen.style.display = 'none';
        welcomeScreen.style.display = 'flex';
        welcomeScreen.classList.add('fade-in');
    };

    backHomeBtn.addEventListener('click', goBackHome);
    backHomeBtn2.addEventListener('click', goBackHome);

    // 再次抽奖按钮点击事件
    drawAgainBtn.addEventListener('click', () => {
        resultScreen.style.display = 'none';
        lotteryScreen.style.display = 'flex';
        lotteryScreen.classList.add('fade-in');
    });

    // 抽奖按钮点击事件
    drawButton.addEventListener('click', () => {
        if (isSpinning) return;

        isSpinning = true;

        // 随机选择一个礼物
        const giftIndex = Math.floor(Math.random() * gifts.length);
        const selectedGift = gifts[giftIndex];

        // 计算转盘需要旋转的角度
        // 每个礼物占据60度（360/6），我们让指针指向对应礼物的中间位置
        const targetAngle = giftIndex * 60 + 30;

        // 计算需要旋转的总角度（当前角度 + 多转几圈 + 目标角度）
        const spinAngle = currentRotation + 360 * 5 + (360 - targetAngle);

        // 应用旋转动画
        turntable.style.transform = `rotate(${spinAngle}deg)`;

        // 更新当前旋转角度
        currentRotation = spinAngle % 360;

        // 5秒后显示抽奖结果
        setTimeout(() => {
            // 显示抽奖结果
            giftImage.src = selectedGift.image;
            giftName.textContent = selectedGift.name;
            giftName.style.color = selectedGift.color;
            giftDescription.textContent = selectedGift.description;

            // 切换到结果页面
            lotteryScreen.style.display = 'none';
            resultScreen.style.display = 'flex';
            resultScreen.classList.add('fade-in');

            isSpinning = false;
        }, 5000);

        // 添加旋转中的按钮状态
        drawButton.textContent = "抽奖中...";
        drawButton.disabled = true;
        drawButton.classList.remove('pulse');

        setTimeout(() => {
            drawButton.textContent = "开始抽奖";
            drawButton.disabled = false;
            drawButton.classList.add('pulse');
        }, 5000);
    });

    // 页面加载完成后初始化
    window.addEventListener('DOMContentLoaded', () => {
        // 设置随机默认图片（如果Unsplash图片加载失败）
        setTimeout(() => {
            const images = document.querySelectorAll('.gift-image');
            images.forEach(img => {
                if (img.complete && img.naturalHeight === 0) {
                    // 图片加载失败，使用备选颜色背景
                    img.src = "";
                    img.style.backgroundColor = "#0099FF";
                    img.style.display = "flex";
                    img.style.alignItems = "center";
                    img.style.justifyContent = "center";
                    img.innerHTML = '<span style="color: white; font-size: 1.2rem;">礼物图片</span>';
                }
            });
        }, 2000);
    });
</script>
</body>
</html>
